appId: com.getinboxzero.desktop
productName: 十组邮件小助手
copyright: 十组邮件小助手 · 开源许可见 LICENSE
artifactName: Shizu-Mail-Assistant-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
asar: true
npmRebuild: false
protocols:
  - name: 十组邮件小助手
    schemes:
      - inboxzero
linux:
  target:
    - target: dir
      arch:
        - x64
mac:
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
  forceCodeSigning: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
publish:
  provider: generic
  url: https://github.com/elie222/inbox-zero/releases/download/desktop-updates
